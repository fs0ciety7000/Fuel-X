# Fuel-X static hosting (ADR 0008, ADR 0009): showcase at /, game at /play, design gallery at /design.html.
# MIME for the rest of the site comes from /etc/nginx/mime.types (http context).
# A server-level `types` block would replace that map, so .glb is set per location.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Behind Coolify's TLS proxy: keep redirects relative so they never downgrade to http://host:80.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml text/javascript application/xml text/plain model/gltf-binary;

  # Headers are repeated per location: nginx drops server-level add_header in a location that sets its own.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Content-hashed build output: cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri =404;
  }

  # GLBs are versioned by ?v=<hash> in the generated wrappers.
  location /models/ {
    default_type model/gltf-binary;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri =404;
  }

  # Showcase plates, OG image and brand marks: stable names, regenerated rarely.
  location ~ ^/(showcase|brand)/ {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri =404;
  }

  # Clean URL for the game; /play.html keeps working.
  location = /play {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files /play.html =404;
  }

  location = /play/ {
    return 301 /play;
  }

  location = / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files /index.html =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri =404;
  }

  # Container healthcheck (Dockerfile HEALTHCHECK, Coolify): no file, no log noise.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Unknown paths fall back to the showcase (it is the front door).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
