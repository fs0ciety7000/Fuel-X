# Fuel-X static hosting (ADR 0008).
# MIME for the rest of the site comes from /etc/nginx/mime.types (http context).
# A server-level `types` block would replace that map, so .glb is set per location.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/css application/javascript application/json image/svg+xml text/javascript;

  add_header X-Content-Type-Options nosniff always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /models/ {
    default_type model/gltf-binary;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = / {
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
